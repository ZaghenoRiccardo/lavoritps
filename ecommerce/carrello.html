<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrello</title>
    <link rel="stylesheet" href="styleCarrello.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
</head>
<body onload=" mostraCarrello(eleP)" >
    
    <div>
        <h1>
            Carrello:
        </h1>

        <hr>

        <div id="layoutCarrello">
        </div>
        <div class = "bottoniFinali">
            <input type="button" value="Torna alla Home" onclick="window.location.href='index.html'">
            <input type="button" value="Paga e Ricevuta" onclick="ricevuta()">
        </div> 
    </div>

</body>

<script>
    let eleP = JSON.parse(localStorage.getItem("elencoProdotti" )) || [];

    function mostraCarrello(eleP) {
    let elencoCarrello = document.getElementById("layoutCarrello");
    elencoCarrello.innerHTML = "";
    let totale = 0;
    let totaleArticoli = 0;

    for (let i = 0; i < eleP.length; i++) {
        const prezzo   = parseInt(eleP[i].prezzo);
        const marca    = eleP[i].marca;
        const nome     = eleP[i].nome;
        const immagine = eleP[i].immagine;

        if (!eleP[i].quantita) eleP[i].quantita = 1;  // fix xundefined

        const quantita = eleP[i].quantita;
        totale += prezzo * quantita;           // prezzo × quantità
        totaleArticoli += quantita;            // somma tutte le quantità

        elencoCarrello.innerHTML += `
            <div>
                <div class="titolo">
                    <p>${marca}</p>
                    <p>${nome}</p>
                    <p>${prezzo}€</p>
                    <p>x${quantita}</p>
                    <input type="button" value="+" onclick="aggiungiProdotto(${i})">
                    <input type="button" value="-" onclick="rimuoviProdotto(${i})">
                </div>
            </div>
        `;
    }

    elencoCarrello.innerHTML += `
        <div class="riga">
            <p>Articoli totali:</p>
            <p>${totaleArticoli}</p>
        </div>
        <div class="riga">
            <p><strong>Totale:</strong></p>
            <p><strong>${totale}€</strong></p>
        </div>
    `;
}

function rimuoviProdotto(i){
    if (eleP[i].quantita > 1) {
        eleP[i].quantita -= 1;
    } else {
        eleP.splice(i, 1); // rimuove il prodotto se quantità arriva a 0
    }
    localStorage.setItem("elencoProdotti", JSON.stringify(eleP));
    mostraCarrello(eleP);
}

function aggiungiProdotto(i){
    
    eleP[i].quantita += 1;
    localStorage.setItem("elencoProdotti", JSON.stringify(eleP));
    mostraCarrello(eleP);

}

function ricevuta(totaleArticoli) {
    if (eleP.length === 0) {
        alert("Carrello vuoto, non posso stampare la ricevuta");
        return;  // esce subito
    }

    alert("Grazie per il tuo acquisto!");

    const { jsPDF } = window.jspdf;
    let doc = new jsPDF();

    /*
    doc.text("RICEVUTA ACQUISTO", 10, 10);

    let y = 35;
    let totale = 0;

    for (let i = 0; i < eleP.length; i++) {
        const quantita  = eleP[i].quantita || 1;
        const prezzo    = parseInt(eleP[i].prezzo);
        const subtotale = prezzo * quantita;
        totale += subtotale;

        doc.text(eleP[i].marca + " " + eleP[i].nome + " - " + prezzo + " EUR x" + quantita + " = " + subtotale + " EUR", 10, y);
        y += 10;
    }

    doc.text("TOTALE: " + totale + " EUR", 10, y + 10);
    */

    const W = 210; // larghezza pagina mm

    // ── SFONDO HEADER ──────────────────────────────────────────
    doc.setFillColor(15, 15, 25);
    doc.rect(0, 0, W, 45, "F");

    // ── ACCENT LINE ────────────────────────────────────────────
    doc.setFillColor(212, 175, 55); // oro
    doc.rect(0, 45, W, 1.5, "F");

    // ── TITOLO ─────────────────────────────────────────────────
    doc.setTextColor(212, 175, 55);
    doc.setFontSize(22);
    doc.setFont("helvetica", "bold");
    doc.text("RICEVUTA D'ACQUISTO", W / 2, 22, { align: "center" });

    // ── SOTTOTITOLO / DATA ─────────────────────────────────────
    doc.setTextColor(180, 180, 180);
    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    const oggi = new Date().toLocaleDateString("it-IT", {
        day: "2-digit", month: "long", year: "numeric"
    });
    doc.text("Data: " + oggi, W / 2, 32, { align: "center" });

    const numero = "ORD-" + Date.now().toString().slice(-6);
    doc.text("N. Ordine: " + numero, W / 2, 39, { align: "center" });

    // ── INTESTAZIONE TABELLA ───────────────────────────────────
    let y = 58;
    doc.setFillColor(240, 240, 240);
    doc.rect(10, y - 6, W - 20, 9, "F");

    doc.setTextColor(30, 30, 30);
    doc.setFontSize(9);
    doc.setFont("helvetica", "bold");
    doc.text("PRODOTTO",        14,  y);
    doc.text("QTA",            120,  y, { align: "center" });
    doc.text("PREZZO",         148,  y, { align: "right" });
    doc.text("SUBTOTALE",      196,  y, { align: "right" });

    // ── LINEA SOTTO HEADER ─────────────────────────────────────
    y += 3;
    doc.setDrawColor(212, 175, 55);
    doc.setLineWidth(0.4);
    doc.line(10, y, W - 10, y);

    // ── RIGHE PRODOTTI ─────────────────────────────────────────
    let totale = 0;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);

    for (let i = 0; i < eleP.length; i++) {
        y += 10;

        // zebra stripe
        if (i % 2 === 0) {
            doc.setFillColor(250, 250, 252);
            doc.rect(10, y - 6, W - 20, 9, "F");
        }

        const quantita  = eleP[i].quantita || 1;
        const prezzo    = parseInt(eleP[i].prezzo);
        const subtotale = prezzo * quantita;
        totale += subtotale;

        doc.setTextColor(30, 30, 30);
        doc.text(eleP[i].marca + " " + eleP[i].nome, 14, y);
        doc.text(String(quantita),                   120, y, { align: "center" });
        doc.text(prezzo + " EUR",                    148, y, { align: "right" });
        doc.text(subtotale + " EUR",                 196, y, { align: "right" });
    }

    // ── LINEA SEPARATORE ──────────────────────────────────────
    y += 8;
    doc.setDrawColor(200, 200, 200);
    doc.setLineWidth(0.3);
    doc.line(10, y, W - 10, y);

    // ── BOX TOTALE ─────────────────────────────────────────────
    y += 5;
    doc.setFillColor(15, 15, 25);
    doc.rect(110, y, W - 120, 14, "F");

    doc.setFillColor(212, 175, 55);
    doc.rect(110, y, 1.5, 14, "F"); // accent left border

    doc.setTextColor(180, 180, 180);
    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.text("TOTALE", 120, y + 6);

    doc.setTextColor(212, 175, 55);
    doc.setFontSize(13);
    doc.setFont("helvetica", "bold");
    doc.text(totale + " EUR", 196, y + 9, { align: "right" });

    // ── MESSAGGIO GRAZIE ───────────────────────────────────────
    y += 28;
    doc.setDrawColor(212, 175, 55);
    doc.setLineWidth(0.4);
    doc.line(10, y, W - 10, y);

    y += 10;
    doc.setTextColor(100, 100, 100);
    doc.setFontSize(9);
    doc.setFont("helvetica", "italic");
    doc.text("Grazie per il tuo acquisto! Conserva questo documento come prova d'acquisto.", W / 2, y, { align: "center" });

    // ── FOOTER ─────────────────────────────────────────────────
    doc.setFillColor(15, 15, 25);
    doc.rect(0, 275, W, 22, "F");

    doc.setFillColor(212, 175, 55);
    doc.rect(0, 275, W, 0.8, "F");

    doc.setTextColor(120, 120, 120);
    doc.setFontSize(7.5);
    doc.setFont("helvetica", "normal");
    doc.text("Documento generato automaticamente - Non ha valore fiscale", W / 2, 284, { align: "center" });
    doc.text(oggi + "  |  " + numero, W / 2, 290, { align: "right" });

    // ── ------─────────────────────────────────────────────────

    doc.save("ricevuta.pdf");

    localStorage.removeItem("elencoProdotti");
    eleP = [];
    mostraCarrello(eleP);

     setTimeout(() => {
                window.location.href = "index.html";
            }, 2000);
}
    
    
</script>

</html>
