<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrello</title>
    <link rel="stylesheet" href="styleSignIn.css">
</head>
<body onload=" mostraCarrello(eleP)" >
    
    <div>
        <h1>
            Carrello:
        </h1>

        <div id="layoutCarrello">
        </div>
    </div>

</body>

<script>
    let eleP = JSON.parse(localStorage.getItem("elencoProdotti" )) || [];

    function mostraCarrello(eleP) {
    let elencoCarrello = document.getElementById("layoutCarrello");
    elencoCarrello.innerHTML = "";
    let totale = 0;

    for (let i = 0; i < eleP.length; i++) {
        const prezzo   = eleP[i].prezzo;
        const marca    = eleP[i].marca;
        const nome     = eleP[i].nome;
        const immagine = eleP[i].immagine;

        const prezzoNum = 0;
        totale += eleP[i].prezzo;

        elencoCarrello.innerHTML += `
            <div>
                <img src="${immagine}" alt="${nome}">
                <p style="text-align: center;">${prezzo}</p>
                <div class="titolo">
                    <p>${marca}</p>
                    <p>${nome}</p>
                </div>
                <div>
                    <input type="button" value="Rimuovi dal Carrello" 
                    onclick="rimuoviProdotto(${i})">
                </div>
            </div>
        `;
    }

    
    elencoCarrello.innerHTML += `
        <div class="riga">
            <p>Articoli totali:</p>
            <p>${eleP.length}</p>
        </div>
        <div class="riga">
            <p><strong>Totale:</strong></p>
            <p><strong>€${totale}</strong></p>
        </div>
    `;
}
    
</script>

</html>
